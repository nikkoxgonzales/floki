name: release

# Push a tag like v0.1.0 to build the Windows binaries from that commit and
# attach them, with checksums and a build attestation, to a draft release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cargo build --release --locked -p floki-service -p floki-cli -p floki-ui

      - name: Package
        shell: bash
        run: |
          name="floki-${GITHUB_REF_NAME}-windows-x64"
          mkdir -p "dist/$name"
          cp target/release/flokid.exe target/release/floki.exe target/release/flk.exe \
            README.md LICENSE "dist/$name/"
          (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null && sha256sum "$name.zip" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.zip

      - name: Draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt \
            --draft --prerelease --title "Floki $GITHUB_REF_NAME" \
            --notes "Release notes to follow."
