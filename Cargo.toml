[workspace]
members = [
    "crates/floki-core",
    "crates/floki-ntfs",
    "crates/floki-proto",
    "crates/floki-service",
    "crates/floki-cli",
    "crates/floki-ui",
    "crates/floki-mcp",
    "crates/floki-bench",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["Nikko Gonzales <nikkoxgonzales@gmail.com>"]
repository = "https://github.com/nikkoxgonzales/floki"
homepage = "https://github.com/nikkoxgonzales/floki"
rust-version = "1.95"

[workspace.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
memchr = "2.8.3"
rayon = "1.12.0"
memmap2 = "0.9.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
regex = "1.13.1"
interprocess = "2.4.4"
clap = { version = "4.6.6", features = ["derive"] }
eframe = "0.36.1"
egui = "0.36.1"
egui_extras = "0.36.1"
tray-icon = "0.24.2"
global-hotkey = "0.8.0"
embed-resource = "3.0.11"
dirs = "6.0.0"
widestring = "1.2.1"
tiny_http = "0.12.0"
getrandom = "0.3.4"
floki-core = { path = "crates/floki-core" }
floki-ntfs = { path = "crates/floki-ntfs" }
floki-proto = { path = "crates/floki-proto" }
floki-mcp = { path = "crates/floki-mcp" }

[workspace.lints.clippy]
all = "warn"
pedantic = "allow"

# Keep target/ small: full debuginfo on every test binary + dep bloated it to 18 GB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
